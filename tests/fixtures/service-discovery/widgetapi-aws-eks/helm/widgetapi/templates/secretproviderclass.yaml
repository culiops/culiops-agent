{{- if .Values.secretsStore.enabled }}
# Secrets Store CSI Driver + AWS provider (ASCP). Mounts the DB credentials
# secret from AWS Secrets Manager into the pods and syncs two keys into a
# Kubernetes Secret ("<release>-db") that the Deployments envFrom.
# Auth is the pod's IRSA role (see platform stack: widgetapi_workload_role_arn).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app.kubernetes.io/name: widgetapi
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  provider: aws
  secretObjects:
    - secretName: {{ .Release.Name }}-db
      type: Opaque
      data:
        - objectName: db_username
          key: DB_USERNAME
        - objectName: db_password
          key: DB_PASSWORD
  parameters:
    region: {{ .Values.env.AWS_REGION | quote }}
    objects: |
      - objectName: "widgetapi/{{ .Values.secretsStore.environment }}/db"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db_username
          - path: password
            objectAlias: db_password
{{- end }}
