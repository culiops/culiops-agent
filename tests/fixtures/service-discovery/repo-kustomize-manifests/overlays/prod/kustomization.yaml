apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notifier
resources:
  - ../../base
patches:
  - path: patch-replicas.yaml
images:
  - name: registry.example.com/notifier-api
    newTag: 1.4.2
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: notifier-api-config
    literals:
      - LOG_LEVEL=info
      - SMTP_HOST=smtp.example.internal
secretGenerator:
  - name: notifier-api-secrets
    type: Opaque
    envs:
      - secrets.env          # gitignored; NOT in this fixture and never opened by the skill
    literals:
      - WEBHOOK_SIGNING_KEY=REDACTED-FIXTURE-VALUE
