apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier-api
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: registry.example.com/notifier-api:1.4.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: notifier-api-config
            - secretRef:
                name: notifier-api-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
