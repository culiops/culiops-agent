apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier-worker
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: registry.example.com/notifier-worker:${IMAGE_TAG}
          envFrom:
            - configMapRef:
                name: notifier-worker-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notifier-worker-secrets
                  key: db-password
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
