AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: thumbnailer - resizes uploaded images (fictional SAM app)

Parameters:
  Stage:
    Type: String
    Default: prod

Resources:
  ThumbnailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub thumbnailer-${Stage}
      Runtime: python3.12
      Handler: app.handler
      CodeUri: src/
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref ThumbnailTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ThumbnailTable

  ThumbnailTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub thumbnailer-${Stage}-items
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
